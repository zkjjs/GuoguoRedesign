name: Build Flutter iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .fvmrc
      - .github/workflows/ios.yml
      - .gitignore
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - analysis_options.yaml
      - ios/**
      - tool/**
  pull_request:
    paths:
      - .fvmrc
      - .github/workflows/ios.yml
      - .gitignore
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - analysis_options.yaml
      - ios/**
      - tool/**

permissions:
  contents: read

concurrency:
  group: guoguo-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      FLUTTER_VERSION: 3.44.6
      FLUTTER_REVISION: ee80f08bbf97172ec030b8751ceab557177a34a6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize Flutter path
        shell: bash
        run: |
          echo "FLUTTER_SDK_DIRECTORY=$RUNNER_TEMP/flutter" >> "$GITHUB_ENV"

      - name: Scan committed sources for secrets
        shell: bash
        run: |
          if git grep -nIE '(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36,})'; then
            echo 'Potential committed secret detected.' >&2
            exit 1
          fi

      - name: Install pinned Flutter
        shell: bash
        run: |
          git init "$FLUTTER_SDK_DIRECTORY"
          git -C "$FLUTTER_SDK_DIRECTORY" remote add origin https://github.com/flutter/flutter.git
          git -C "$FLUTTER_SDK_DIRECTORY" fetch --depth=1 origin "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$FLUTTER_SDK_DIRECTORY" checkout --detach "refs/tags/$FLUTTER_VERSION"
          test "$(git -C "$FLUTTER_SDK_DIRECTORY" rev-parse HEAD)" = "$FLUTTER_REVISION"
          "$FLUTTER_SDK_DIRECTORY/bin/flutter" config --no-analytics
          echo "$FLUTTER_SDK_DIRECTORY/bin" >> "$GITHUB_PATH"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Pre-cache iOS artifacts
        run: flutter precache --ios

      - name: Install CocoaPods dependencies
        working-directory: ios
        env:
          LANG: en_US.UTF-8
        run: pod install

      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH"
          rm -rf build/ipa_unsigned
          mkdir -p build/ipa_unsigned/Payload
          cp -R "$APP_PATH" build/ipa_unsigned/Payload/Runner.app
          cd build/ipa_unsigned
          /usr/bin/zip -qry ../GuoguoRedesign-unsigned.ipa Payload
          cd ../..
          ls -lh build/GuoguoRedesign-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GuoguoRedesign-unsigned-ipa
          path: build/GuoguoRedesign-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Runner.app
        uses: actions/upload-artifact@v4
        with:
          name: GuoguoRedesign-Runner-app
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 14
