name: Task 2 Linux verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ios.yml
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - analysis_options.yaml

permissions:
  contents: read

concurrency:
  group: guoguo-task2-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  widget-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLUTTER_VERSION: 3.44.6
      FLUTTER_REVISION: ee80f08bbf97172ec030b8751ceab557177a34a6
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Flutter
        shell: bash
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth=1 origin "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "refs/tags/$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run Task 2 widget tests
        run: flutter test --reporter expanded test/app/app_shell_test.dart
